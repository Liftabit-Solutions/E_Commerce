<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Rich Obsidian / Slate-950 matching the app logo -->
    <linearGradient id="custBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Refined Border Gradient for contrast on both dark & light browser tabs -->
    <linearGradient id="custBorder" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Pure White to Soft Platinum Gradient for the Monogram 'E' -->
    <linearGradient id="eGrad" x1="17" y1="15" x2="47" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Application Squircle Base (Matching bg-slate-950 rounded-xl) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#custBg)" stroke="url(#custBorder)" stroke-width="2" filter="url(#softGlow)"/>

  <!-- Application Logo 'E' (Centered with perfection) -->
  <!-- Vertical Stem -->
  <rect x="17" y="15" width="8.5" height="34" rx="3.5" fill="url(#eGrad)"/>
  
  <!-- Top Arm -->
  <rect x="17" y="15" width="30" height="8" rx="3.5" fill="url(#eGrad)"/>
  
  <!-- Middle Arm -->
  <rect x="17" y="28" width="23" height="8" rx="3.5" fill="url(#eGrad)"/>
  
  <!-- Bottom Arm -->
  <rect x="17" y="41" width="30" height="8" rx="3.5" fill="url(#eGrad)"/>
</svg>
