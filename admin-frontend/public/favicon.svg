<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Tech Obsidian Charcoal -->
    <linearGradient id="adminBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Subtle Admin Security Border Highlight -->
    <linearGradient id="adminBorder" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#475569" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Monogram 'E' Gradient -->
    <linearGradient id="adminEGrad" x1="17" y1="15" x2="47" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Golden Lock Gradient -->
    <linearGradient id="lockGrad" x1="33" y1="18" x2="49" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="shackleGrad" x1="36" y1="8" x2="46" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="lockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Application Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#adminBg)" stroke="url(#adminBorder)" stroke-width="2" filter="url(#softGlow)"/>

  <!-- Application Logo 'E' -->
  <!-- Vertical Stem -->
  <rect x="17" y="15" width="8.5" height="34" rx="3.5" fill="url(#adminEGrad)"/>
  
  <!-- Top Arm -->
  <rect x="17" y="15" width="30" height="8" rx="3.5" fill="url(#adminEGrad)"/>
  
  <!-- Middle Arm -->
  <rect x="17" y="28" width="23" height="8" rx="3.5" fill="url(#adminEGrad)"/>
  
  <!-- Bottom Arm -->
  <rect x="17" y="41" width="30" height="8" rx="3.5" fill="url(#adminEGrad)"/>

  <!-- Lock in E (Integrated in upper cavity / top-right of E) -->
  <g filter="url(#lockShadow)">
    <!-- Lock Shackle -->
    <path d="M37 19 V13.5 C37 10.74 39.24 8.5 42 8.5 C44.76 8.5 47 10.74 47 13.5 V19" 
          stroke="url(#shackleGrad)" stroke-width="2.75" stroke-linecap="round" fill="none"/>
    
    <!-- Lock Body -->
    <rect x="33.5" y="18.5" width="17" height="13.5" rx="3" fill="url(#lockGrad)" stroke="#B45309" stroke-width="0.75"/>
    
    <!-- Keyhole (Circle + Slot) -->
    <circle cx="42" cy="23.5" r="1.6" fill="#090D16"/>
    <path d="M41.25 24.5 L42.75 24.5 L43.1 28 L40.9 28 Z" fill="#090D16"/>
  </g>
</svg>
